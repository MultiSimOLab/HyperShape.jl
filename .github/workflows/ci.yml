name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write   # julia-actions/cache deletes the old caches it has created
  contents: read
  id-token: write  # Codecov upload with OIDC (no token)

jobs:
  test:
    name: Tests (${{ matrix.version }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # coverage only after a merge (push to main) or on demand, never on pull requests: instrumented, the suite is
    # about three times slower
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 360 }}
    env:
      HYPERSHAPE_TEST_GROUP: ${{ matrix.group }}   # the suite in parallel jobs (see test/runtests.jl)
      JULIA_NUM_THREADS: 4                          # the threaded kernels and the asynchronous writers
    strategy:
      fail-fast: false
      matrix:
        version: ['min', '1'] # min = lowest Julia allowed by [compat]
        group: ['core', 'methods', 'validation']
        arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1' && github.event_name != 'pull_request' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && github.event_name != 'pull_request'
        continue-on-error: true
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1' && github.event_name != 'pull_request'
        with:
          files: lcov.info
          flags: ${{ matrix.group }}  # one upload per test group; Codecov merges them
          use_oidc: true
          fail_ci_if_error: false
