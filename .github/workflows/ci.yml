name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: # needed to allow julia-actions/cache to delete old caches that it has created
  actions: write
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.version }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HYPERSHAPE_TEST_GROUP: ${{ matrix.group }}   # the suite in parallel jobs (see test/runtests.jl)
      JULIA_NUM_THREADS: 4                          # the threaded kernels and the asynchronous writers
    strategy:
      fail-fast: false
      matrix:
        version: ['min', '1'] # min = lowest Julia allowed by [compat]
        group: ['core', 'methods', 'validation']
        arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false   # not uploaded anywhere; with it the suite is about three times slower
